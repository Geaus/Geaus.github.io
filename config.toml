baseURL = 'https://geaus.github.io/'
locale = 'zh-cn'
title = 'Geaus Blog'
theme = 'hugo-book'

disablePathToLower = true
enableGitInfo = true
disableKinds = ['taxonomy', 'term']

[markup]
[markup.goldmark.renderer]
  unsafe = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false
[markup.highlight]
  style = 'github'

[menu]
[[menu.main]]
  name = '源码解读'
  pageRef = '/docs/source-reading'
  weight = 10

[[menu.main]]
  name = '投资心得'
  pageRef = '/docs/investing'
  weight = 20

[[menu.main]]
  name = '面经整理'
  pageRef = '/docs/interviews'
  weight = 30

[params]
  BookTheme = 'light'
  BookSection = 'docs'
  BookToC = true
  BookSearch = true
  BookComments = false
  BookDateFormat = '2006-01-02'
